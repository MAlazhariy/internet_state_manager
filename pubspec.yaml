name: internet_state_manager
description: Seamless internet connection management for Flutter. Auto-detect, handle outages, and restore state with minimal code.
homepage: https://github.com/MAlazhariy/internet_state_manager
issue_tracker: https://github.com/MAlazhariy/internet_state_manager/issues
version: 1.9.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.9.1
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - internet
  - internet-connection
  - connectivity
  - internet-state-manager
  - auto-check-internet

